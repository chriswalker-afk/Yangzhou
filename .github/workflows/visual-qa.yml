name: V2 composition and browser QA
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser tester
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run desktop, mobile, 16-square ring and 32-variant gallery
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/yangzhou-http.log 2>&1 &
          sleep 2
          node tests/visual.cjs
          node tests/v3-edge-visual.cjs
          node tests/v3-verge-visual.cjs
          node tests/v3-junction-visual.cjs
          node tests/v3-layer2-visual.cjs
          node tests/v3-courtyard-enclosure-visual.cjs
          node tests/v3-wall-geometry-visual.cjs
          node tests/v3-wall-roof-texture-visual.cjs
          node tests/v3-wall-profile-visual.cjs
          node tests/v3-wall-face-materials-visual.cjs
          node tests/v3-wall-corners-visual.cjs
          node tests/v3-wall-endcaps-visual.cjs
      - name: Keep preview screenshots (not painterly approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yangzhou-v2-and-v3-labs-screenshots
          path: |
            artifacts/v2/
            artifacts/v3/
          retention-days: 14
