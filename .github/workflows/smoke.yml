name: V2 logic and route-contract smoke
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax, camera, board topology and scoring contracts
        run: |
          node --check tile-topology.js
          node --check tile-art-v2.js
          python3 -m py_compile scripts/import_yangzhou_art_pack.py
          node --check tests/smoke.cjs
          node --check tests/v2-contract.cjs
          node --check assets/v3/base-geometry.js
          node --check tests/v3-geometry.cjs
          node --check assets/v3/material-runtime.js
          node --check assets/v3/edge-system.js
          node --check tests/v3-materials.cjs
          node --check tests/v3-edges.cjs
          node tests/smoke.cjs
          node tests/v2-contract.cjs
          node tests/v3-geometry.cjs
          node tests/v3-materials.cjs
          node tests/v3-edges.cjs
          node tests/variant-deck.cjs
          node scripts/validate_art_batch_01.cjs
          node tests/scoring-contract.cjs
          node scripts/validate_street_pair.cjs
