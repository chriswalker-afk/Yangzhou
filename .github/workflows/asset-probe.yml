name: Test asset transfer fidelity
on:
  push:
    branches:
      - feat/handscroll-production-assets
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check canvas asset variants
        env:
          ORIGINAL: 'https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F5309ea3d-f013-41fe-8211-7621b6401e67/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAMe4rGIUnVG2oAd-G77yCEwZh3gzlLWgSJngqSz1F7G2&exp=1794213075&osig=AAAAAAAAAAAAAAAAAAAAACbJw4CuSkpgWFRSEHCdQheu5CJcVMEvGkj_BNZQJrox&signer=media-rpc&token=AAIAAU0AJDUzMDllYTNkLWYwMTMtNDFmZS04MjExLTc2MjFiNjQwMWU2NwAAAAABob9u2Dg86Z3IxXDrN8HpvE6Mx79Qim7NvypmFOkTq-aQleQpWQ&x-canva-quality=thumbnail'
        run: |
          python3 - <<'PY'
          import os,urllib.request,urllib.error,urllib.parse,re,struct
          u=os.environ["ORIGINAL"]
          variants={
            "thumbnail":u,
            "large-signed":u.replace("height:150","height:1086").replace("width:200","width:1448"),
            "large-unsigned":u.split("?")[0].replace("height:150","height:1086").replace("width:200","width:1448"),
            "original-unsigned":u.split("?")[0],
          }
          for name,url in variants.items():
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=12) as r:
                data=r.read(6_000_000)
                print(name,"status",r.status,"mime",r.headers.get("Content-Type"),"bytes",len(data),"png dimensions",struct.unpack(">II",data[16:24]) if data[:8]==b"\x89PNG\r\n\x1a\n" else "-")
            except Exception as e: print(name,"ERROR",type(e).__name__,str(e)[:200])
          PY
