name: Build Living Painting Assets
on:
  push:
    branches: [feat/living-painting-architecture]
permissions:
  contents: write
concurrency:
  group: living-art-feature-branch
  cancel-in-progress: true
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[generated-assets]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image-processing dependencies
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13" "numpy>=1.26,<3" "opencv-python-headless>=4.9,<5"
      - name: Generate painted clean plate and extracted alpha layers
        run: python scripts/build_living_assets.py
      - name: Validate transparent PNGs and clean-plate dimensions
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('assets/living')
          expected=['starter-clean.webp','bridge-foreground.png','willow-foreground.png','boat-upper.png','boat-lower.png','walker-blue.png','walker-rose.png','walker-ochre.png','cleanup-mask.png','manifest.json']
          for fn in expected: assert (root/fn).exists(),fn
          assert Image.open(root/'starter-clean.webp').size==(1200,800)
          for fn in ['bridge-foreground.png','willow-foreground.png','boat-upper.png','boat-lower.png','walker-blue.png','walker-rose.png','walker-ochre.png']:
            im=Image.open(root/fn); assert im.mode=='RGBA',fn
            alpha=im.getchannel('A'); assert alpha.getextrema()[0]==0 and alpha.getextrema()[1]>0,fn
          print('All layered illustration assets generated and checked')
          PY
      - name: Commit built assets into the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/living/
          if ! git diff --cached --quiet; then
            git commit -m "Generate clean scene and independent painted layer assets [generated-assets]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
